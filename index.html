<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso | Gestión de Personal</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">CP</div>
    <p class="eyebrow">PORTAL DE DISTRIBUIDORES</p>
    <h1>Gestión de Personal</h1>
    <p class="muted">Ingresa con el código y contraseña asignados.</p>
    <form id="loginForm" novalidate>
      <label for="codigo">Código de usuario</label>
      <input id="codigo" name="codigo" autocomplete="username" required maxlength="50">
      <label for="password">Contraseña</label>
      <div class="password-row">
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
        <button id="togglePassword" class="ghost small" type="button">Ver</button>
      </div>
      <p id="loginMessage" class="message" role="alert"></p>
      <button id="loginButton" class="primary full" type="submit">Ingresar</button>
    </form>
  </main>
  <script type="module" src="./js/login.js"></script>
</body>
</html>
