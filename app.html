<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de Personal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark small-mark">CP</span><strong>Personal</strong></div>
      <nav id="menu" aria-label="Menú principal"></nav>
      <button id="logoutButton" class="ghost logout" type="button">Cerrar sesión</button>
    </aside>
    <section class="workspace">
      <header class="topbar">
        <div><p class="eyebrow" id="roleLabel"></p><h1 id="pageTitle">Resumen</h1></div>
        <div class="user-chip"><span id="userName"></span><small id="userCode"></small></div>
      </header>
      <main id="content" class="content"><div class="loading">Cargando...</div></main>
    </section>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
